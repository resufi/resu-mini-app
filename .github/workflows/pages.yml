name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run selftest
      - run: npm run smoke
      - run: npm run check-env

      - name: Check TonConnect manifest
        env:
          VITE_TONCONNECT_MANIFEST_URL: ${{ secrets.VITE_TONCONNECT_MANIFEST_URL }}
          PAGES_ORIGIN: https://${{ github.repository_owner }}.github.io
        run: npm run check-manifest

      - name: Build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_NETWORK: ${{ secrets.VITE_NETWORK || 'mainnet' }}
          VITE_TONCONNECT_MANIFEST_URL: ${{ secrets.VITE_TONCONNECT_MANIFEST_URL }}
          VITE_TON_ENDPOINT: ${{ secrets.VITE_TON_ENDPOINT }}
          VITE_TONCENTER_API_KEY: ${{ secrets.VITE_TONCENTER_API_KEY }}

        run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
